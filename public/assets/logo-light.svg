<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" fill="none">
  <!-- Shield Emblem Icon -->
  <g transform="translate(10, 8)">
    <!-- Outer Shield / Circle with Green Ring -->
    <circle cx="32" cy="32" r="30" fill="#033F2D" stroke="#C7F268" stroke-width="2.5" />
    <circle cx="32" cy="32" r="25" fill="#064E3B" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3 2" />
    
    <!-- Central Shield -->
    <path d="M32 14 L46 20 V33 C46 41 40 47 32 50 C24 47 18 41 18 33 V20 Z" fill="#033F2D" stroke="#C7F268" stroke-width="1.8" />
    
    <!-- Pest Target Crosshair / Leaf Accent -->
    <circle cx="32" cy="32" r="8" fill="#10B981" />
    <line x1="32" y1="21" x2="32" y2="43" stroke="#C7F268" stroke-width="1.5" stroke-linecap="round" />
    <line x1="21" y1="32" x2="43" y2="32" stroke="#C7F268" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="32" cy="32" r="3.5" fill="#FFFFFF" />
    
    <!-- Small Leaf Accent -->
    <path d="M47 13 C49 17 48 21 44 23 C42 20 44 15 47 13 Z" fill="#C7F268" />
  </g>

  <!-- Typography: Arabic Text (RTL friendly) -->
  <g transform="translate(80, 0)">
    <!-- Main Title -->
    <text x="0" y="38" fill="#FFFFFF" font-size="20" font-weight="800" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" letter-spacing="-0.2">
      المركز الفني المتخصص
    </text>
    <!-- Subtitle -->
    <text x="0" y="58" fill="#C7F268" font-size="13" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
      لمكافحة الحشرات والقوارض
    </text>
  </g>
</svg>
